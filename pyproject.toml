[project]
name = "brando"
version = "0.3.0"
description = "Systematic brand creation, phonetic euphony scoring, visual geometry analysis, and trademark vetting framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Fair-Source-1.0-FAL" }
keywords = [
  "branding",
  "naming",
  "phonetics",
  "trademarks",
  "numerology",
  "nlp",
  "domain-research",
  "rapidfuzz",
  "cli",
  "sdk"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Linguistic",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]
authors = [
    { name = "Sunil Sharma (mrxsierra)", email = "9.sunilsharma@gmail.com" }
]
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.3.0",
    "pip-audit>=2.7.0",
    "mkdocs-material>=9.5.0",
    "mike>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/mrxsierra/brando"
Documentation = "https://mrxsierra.github.io/brando/"
Source = "https://github.com/mrxsierra/brando"
Changelog = "https://github.com/mrxsierra/brando/blob/dev/CHANGELOG.md"
Issues = "https://github.com/mrxsierra/brando/issues"

[project.scripts]
brando = "brando.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
ignore = ["E501"]
