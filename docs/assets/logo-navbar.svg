<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --nav-text: #0F172A;
        --nav-dot: #2563EB;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --nav-text: #FFFFFF;
          --nav-dot: #3B82F6;
        }
      }
      .nav-wordmark { fill: var(--nav-text); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif; font-size: 52px; font-weight: 900; letter-spacing: -2.5px; }
      .nav-dot { fill: var(--nav-dot); }
    </style>
  </defs>

  <text x="5" y="48" class="nav-wordmark">brando<tspan class="nav-dot">.</tspan></text>
</svg>
