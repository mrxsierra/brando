<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --canvas-bg: #F8FAFC;
        --title-color: #0F172A;
        --dot-color: #2563EB;
        --divider-stroke: #2563EB;
        --tagline-color: #475569;
        --url-color: #2563EB;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas-bg: #090D16;
          --title-color: #FFFFFF;
          --dot-color: #3B82F6;
          --divider-stroke: #3B82F6;
          --tagline-color: #94A3B8;
          --url-color: #3B82F6;
        }
      }
      .og-bg { fill: var(--canvas-bg); }
      .og-title { fill: var(--title-color); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif; font-size: 140px; font-weight: 900; letter-spacing: -6px; }
      .og-dot { fill: var(--dot-color); }
      .og-divider { stroke: var(--divider-stroke); stroke-width: 6px; }
      .og-tagline { fill: var(--tagline-color); font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 4px; }
      .og-url { fill: var(--url-color); font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', monospace; font-weight: 600; font-size: 22px; }
    </style>
  </defs>

  <!-- Full-Bleed Modern Canvas (No Outer Frame Box) -->
  <rect width="1200" height="630" class="og-bg"/>
  
  <g transform="translate(100, 180)">
    <text x="0" y="120" class="og-title">brando<tspan class="og-dot">.</tspan></text>
    <line x1="0" y1="180" x2="1000" y2="180" class="og-divider"/>
    <text x="5" y="240" class="og-tagline">PROGRAMMATIC BRAND CREATION FRAMEWORK</text>
    <text x="5" y="310" class="og-url">github.com/mrxsierra/brando</text>
  </g>
</svg>
