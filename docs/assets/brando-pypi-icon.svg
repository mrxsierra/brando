<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --icon-bg: #F8FAFC;
        --icon-stroke: #CBD5E1;
        --icon-text: #0F172A;
        --icon-dot: #2563EB;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --icon-bg: #090D16;
          --icon-stroke: #1E293B;
          --icon-text: #FFFFFF;
          --icon-dot: #3B82F6;
        }
      }
      .icon-rect { fill: var(--icon-bg); stroke: var(--icon-stroke); stroke-width: 8px; }
      .icon-monogram { fill: var(--icon-text); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif; font-size: 320px; font-weight: 900; }
      .icon-dot { fill: var(--icon-dot); }
    </style>
  </defs>

  <rect width="512" height="512" rx="96" class="icon-rect"/>
  <text x="125" y="355" class="icon-monogram">b<tspan class="icon-dot">.</tspan></text>
</svg>
