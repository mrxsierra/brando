<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 220" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --canvas-bg: #F8FAFC;
        --canvas-stroke: #CBD5E1;
        --text-wordmark: #0F172A;
        --dot-accent: #2563EB;
        --divider-stroke: #0F172A;
        --tagline-color: #475569;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas-bg: #090D16;
          --canvas-stroke: #1E293B;
          --text-wordmark: #FFFFFF;
          --dot-accent: #3B82F6;
          --divider-stroke: #334155;
          --tagline-color: #94A3B8;
        }
      }
      .banner-rect { fill: var(--canvas-bg); stroke: var(--canvas-stroke); stroke-width: 2px; }
      .wordmark-text { fill: var(--text-wordmark); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 74px; font-weight: 900; letter-spacing: -3.5px; }
      .dot-text { fill: var(--dot-accent); }
      .divider-line { stroke: var(--divider-stroke); stroke-width: 2.5px; }
      .tagline-text { fill: var(--tagline-color); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Auto-Adaptive Container Canvas -->
  <rect x="10" y="10" width="630" height="200" rx="8" class="banner-rect"/>
  
  <g transform="translate(45, 48)">
    <!-- Primary Wordmark with Execution Period -->
    <text x="10" y="62" class="wordmark-text">brando<tspan class="dot-text">.</tspan></text>
    
    <!-- Precision Structural Divider -->
    <line x1="10" y1="92" x2="560" y2="92" class="divider-line"/>
    
    <!-- Clean Sub-headline -->
    <text x="12" y="124" class="tagline-text">SYSTEMATIC BRAND CREATION &amp; RESEARCH</text>
  </g>
</svg>
