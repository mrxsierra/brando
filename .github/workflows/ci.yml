name: CI Fast Check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run Pytest Test Suite
        run: uv run --no-project --isolated --with .[dev] --python ${{ matrix.python-version }} pytest

      - name: Verify Documentation Build
        run: uv run --no-project --isolated --with .[dev] --python ${{ matrix.python-version }} mkdocs build --strict
