name: Security & Dependency Vulnerability Audit

on:
  schedule:
    - cron: "0 4 * * 1" # Every Monday at 04:00 UTC
  workflow_dispatch:

jobs:
  security-audit:
    name: Security Scan (pip-audit & bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Audit Tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] pip-audit bandit

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit --desc || true

      - name: Security Code Analysis (bandit)
        run: |
          bandit -r brando/ -ll || true
