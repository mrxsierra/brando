name: PR Fast Check (Linter, Format, Unit Tests & Security)

on:
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-fast-check:
    name: Fast Quality Gate (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Package & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] pip-audit

      - name: Linting & Import Order Check (ruff check)
        run: |
          ruff check .

      - name: Formatting Standard Check (ruff format)
        run: |
          ruff format --check .

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit --ignore-code 1 || true

      - name: Execute Fast Unit Tests (pytest)
        run: |
          pytest --verbose tests/unit/
