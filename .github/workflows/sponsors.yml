name: Update Sponsors Wall

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday
  workflow_dispatch:

jobs:
  update-sponsors:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Sponsors & Update SPONSORS.md
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "# Brando Sponsors & Supporters" > SPONSORS.md
          echo "Thank you to our community sponsors for supporting open-source computational branding!" >> SPONSORS.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SPONSORS.md
          git diff --quiet || git commit -m "docs(sponsors): update automated sponsors wall" && git push || true
